name: CD - Construcción y Push a Docker Hub

on:
  push:
    branches:
      - 'feature/*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: frontend
            path: src/frontend
          - name: productcatalogservice
            path: src/productcatalogservice
          - name: checkoutservice
            path: src/checkoutservice
          - name: cartservice
            path: src/cartservice/src
    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y subir imagen (Push)
        uses: docker/build-push-action@v4
        with:
          context: ./${{ matrix.path }}
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.name }}:${{ github.sha }}, ${{ secrets.DOCKER_USERNAME }}/${{ matrix.name }}:latest